<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom College - Student Registration</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
            padding: 20px;
        }
        .form-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 40px;
            border: 2px solid #333;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .form-title {
            text-align: center;
            color: #333;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .form-subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .section-title {
            text-align: center;
            font-weight: bold;
            margin: 30px 0 20px 0;
            color: #333;
        }
        .form-label {
            font-weight: 500;
            color: #333;
        }
        .btn-custom {
            background-color: #888;
            color: white;
            border: none;
            padding: 10px 30px;
            margin: 0 10px;
        }
        .btn-custom:hover {
            background-color: #666;
            color: white;
        }
        .button-container {
            text-align: center;
            margin-top: 30px;
        }
        .image-note {
            font-size: 0.85em;
            color: #666;
        }
        .event-log {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #333;
            color: white;
            padding: 15px;
            border-radius: 8px;
            max-width: 300px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 0.9em;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .event-log h6 {
            margin: 0 0 10px 0;
            color: #ffc107;
        }
        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid #555;
        }
        .log-entry:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2 class="form-title">BLOOM COLLEGE</h2>
        <p class="form-subtitle">Student Registration From</p>
        
        <form id="registrationForm">
            <div class="mb-3">
                <label for="studentImage" class="form-label">Student Image:</label>
                <input type="file" class="form-control" id="studentImage" accept="image/*">
                <small class="image-note">(less than 5 MB)</small>
            </div>

            <div class="mb-3">
                <label for="studentName" class="form-label">Student Name:</label>
                <input type="text" class="form-control" id="studentName" placeholder="Full Name">
            </div>

            <div class="mb-3">
                <label for="fatherName" class="form-label">Father's Name:</label>
                <input type="text" class="form-control" id="fatherName" placeholder="Father's Full Name">
            </div>

            <div class="mb-3">
                <label for="motherName" class="form-label">Mother's Name:</label>
                <input type="text" class="form-control" id="motherName" placeholder="Mother's Full Name">
            </div>

            <div class="mb-3">
                <label class="form-label">Gender:</label>
                <div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="male" value="Male">
                        <label class="form-check-label" for="male">Male</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="female" value="Female">
                        <label class="form-check-label" for="female">Female</label>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label for="dob" class="form-label">Date of Birth:</label>
                <input type="date" class="form-control" id="dob">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">E-mail:</label>
                <input type="email" class="form-control" id="email" placeholder="email@example.com">
            </div>

            <div class="mb-3">
                <label for="level" class="form-label">Level:</label>
                <select class="form-select" id="level">
                    <option value="PhD">PhD</option>
                    <option value="Masters">Masters</option>
                    <option value="Bachelor">Bachelor</option>
                    <option value="Diploma">Diploma</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="department" class="form-label">Department:</label>
                <select class="form-select" id="department">
                    <option value="Computer Engineering">Computer Engineering</option>
                    <option value="Civil Engineering">Civil Engineering</option>
                    <option value="Mechanical Engineering">Mechanical Engineering</option>
                    <option value="Electrical Engineering">Electrical Engineering</option>
                    <option value="Electronics Engineering">Electronics Engineering</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="mobile" class="form-label">Tel/Mobile:</label>
                <input type="tel" class="form-control" id="mobile" placeholder="123-456-7890">
            </div>

            <h4 class="section-title">Address</h4>

            <div class="mb-3">
                <label for="state" class="form-label">State:</label>
                <input type="text" class="form-control" id="state" placeholder="State">
            </div>

            <div class="mb-3">
                <label for="city" class="form-label">City:</label>
                <input type="text" class="form-control" id="city" placeholder="City">
            </div>

            <div class="mb-3">
                <label for="postcode" class="form-label">Postcode:</label>
                <input type="text" class="form-control" id="postcode" placeholder="Postcode">
            </div>

            <div class="button-container">
                <button type="submit" class="btn btn-custom">Register</button>
                <button type="reset" class="btn btn-custom">Reset</button>
            </div>
        </form>
    </div>

    <!-- Event Log Box -->
    <div class="event-log" id="eventLog">
        <h6>📋 Event Log</h6>
        <div id="logContent">
            <small>Interact with the form to see events...</small>
        </div>
    </div>

    <!-- Bootstrap Modal -->
    <div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="successModalLabel">Registration Successful</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Your details have been saved!
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        // i. onBlur - when field loses focus
        function handleBlur(event) {
            console.log(event.target.id + ' lost focus');
        }

        // ii. onFocus - when email gets focus
        function handleEmailFocus(event) {
            event.target.style.backgroundColor = '#ffffcc';
        }

        function handleEmailBlur(event) {
            event.target.style.backgroundColor = '';
        }

        // iii. onChange - convert to uppercase
        function convertToUpper(event) {
            event.target.value = event.target.value.toUpperCase();
        }

        // iv. Form submission - show modal
        function handleSubmit(event) {
            event.preventDefault();
            var modal = new bootstrap.Modal(document.getElementById('successModal'));
            modal.show();
        }

        // Attach events
        document.getElementById('studentName').onchange = convertToUpper;
        document.getElementById('fatherName').onchange = convertToUpper;
        document.getElementById('motherName').onchange = convertToUpper;
        
        document.getElementById('email').onfocus = handleEmailFocus;
        document.getElementById('email').onblur = handleEmailBlur;
        
        document.getElementById('registrationForm').onsubmit = handleSubmit;
        
        // Add blur to all text inputs
        var inputs = document.querySelectorAll('input[type="text"], input[type="email"]');
        for(var i = 0; i < inputs.length; i++) {
            inputs[i].onblur = handleBlur;
        }
    </script>
</body>
</html>
